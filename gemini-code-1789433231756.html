<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>지각 방지 타임매니저 - Don't Be Late!</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --primary: #4a90e2;
            --warning: #f39c12;
            --danger: #e74c3c;
            --text: #333333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 25px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        h1 {
            font-size: 1.5rem;
            text-align: center;
            color: var(--primary);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: bold;
            color: #666;
        }

        input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: var(--primary);
        }

        .row {
            display: flex;
            gap: 10px;
        }

        .row .form-group {
            flex: 1;
        }

        button {
            padding: 14px;
            background-color: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #357abd;
        }

        /* 카운트다운 카드 */
        .dashboard {
            background-color: #f8f9fa;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            border: 2px solid #eee;
            display: none;
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            margin-bottom: 10px;
        }

        .target-time-info {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .timer-display {
            font-size: 2.2rem;
            font-weight: 800;
            color: #222;
            margin-bottom: 10px;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: #ddd;
            border-radius: 5px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background-color: var(--primary);
            transition: width 1s linear, background-color 0.5s;
        }

        /* 체크리스트 */
        .checklist-section {
            display: none;
        }

        .checklist-title {
            font-size: 1rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .checklist {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .checklist li {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95rem;
            background: #f9f9f9;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .checklist input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        /* 지각 상태별 스타일 */
        .status-safe { background-color: #2ecc71 !important; }
        .status-warning { background-color: var(--warning) !important; }
        .status-danger { background-color: var(--danger) !important; }
    </style>
</head>
<body>

    <div class="container">
        <h1>⏰ 지각 방지 매니저</h1>

        <!-- 약속 입력 폼 -->
        <div class="form-group">
            <label for="title">약속 이름</label>
            <input type="text" id="title" placeholder="예: 강남역 스터디 모임">
        </div>

        <div class="form-group">
            <label for="meetTime">약속 시간</label>
            <input type="datetime-local" id="meetTime">
        </div>

        <div class="row">
            <div class="form-group">
                <label for="travelTime">이동 시간 (분)</label>
                <input type="number" id="travelTime" placeholder="40" min="0">
            </div>
            <div class="form-group">
                <label for="prepTime">외출 준비 (분)</label>
                <input type="number" id="prepTime" placeholder="30" min="0">
            </div>
        </div>

        <button id="startBtn">타이머 시작</button>

        <!-- 카운트다운 대시보드 -->
        <div class="dashboard" id="dashboard">
            <div class="status-badge" id="statusBadge">준비 중</div>
            <div class="target-time-info" id="targetInfo">
                출발 목표 시각: <b id="departureTimeText">--:--</b>
            </div>

            <div class="timer-display" id="timerDisplay">00:00:00</div>

            <div class="progress-bar-bg">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>

        <!-- 외출 전 체크리스트 -->
        <div class="checklist-section" id="checklistSection">
            <div class="checklist-title">🎒 출발 전 필수 체크리스트</div>
            <ul class="checklist">
                <li><input type="checkbox"> 지갑 / 카드 챙기기</li>
                <li><input type="checkbox"> 스마트폰 & 배터리 챙기기</li>
                <li><input type="checkbox"> 집 문 잠그기 / 가스 불 확인</li>
                <li><input type="checkbox"> 에어컨 / 불 끄기</li>
            </ul>
        </div>
    </div>

    <script>
        // 요소 가져오기
        const titleInput = document.getElementById('title');
        const meetTimeInput = document.getElementById('meetTime');
        const travelTimeInput = document.getElementById('travelTime');
        const prepTimeInput = document.getElementById('prepTime');
        const startBtn = document.getElementById('startBtn');
        
        const dashboard = document.getElementById('dashboard');
        const statusBadge = document.getElementById('statusBadge');
        const departureTimeText = document.getElementById('departureTimeText');
        const timerDisplay = document.getElementById('timerDisplay');
        const progressBar = document.getElementById('progressBar');
        const checklistSection = document.getElementById('checklistSection');

        let timerInterval = null;
        let departureTimestamp = 0;
        let totalDurationSec = 0;
        let alarmTriggered = false;

        // 알림음 재생 (Web Audio API)
        function playAlarmSound() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(880, audioCtx.currentTime); // A5 음
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            // 0.2초간 3번 울림
            setTimeout(() => osc.stop(), 600);
        }

        // 기본값 세팅 (현재 시간 기준 + 2시간 후로 자동 설정)
        const now = new Date();
        now.setHours(now.getHours() + 2);
        now.setMinutes(0);
        meetTimeInput.value = new Date(now.getTime() - (now.getTimezoneOffset() * 60000)).toISOString().slice(0, 16);

        // 로컬스토리지 불러오기
        window.onload = () => {
            const savedData = JSON.parse(localStorage.getItem('dont_be_late_data'));
            if (savedData) {
                titleInput.value = savedData.title || '';
                travelTimeInput.value = savedData.travelTime || '';
                prepTimeInput.value = savedData.prepTime || '';
            }
        };

        // 타이머 시작 버튼 이벤트
        startBtn.addEventListener('click', () => {
            const meetTime = new Date(meetTimeInput.value).getTime();
            const travelMinutes = parseInt(travelTimeInput.value) || 0;
            const prepMinutes = parseInt(prepTimeInput.value) || 0;

            if (!meetTime) {
                alert('약속 시간을 설정해 주세요!');
                return;
            }

            // 로컬스토리지에 저장
            localStorage.setItem('dont_be_late_data', JSON.stringify({
                title: titleInput.value,
                travelTime: travelTimeInput.value,
                prepTime: prepTimeInput.value
            }));

            // 총 차감 시간 (분 -> 밀리초)
            const totalLeadTimeMs = (travelMinutes + prepMinutes) * 60 * 1000;
            departureTimestamp = meetTime - (travelMinutes * 60 * 1000); // 실제 집에서 나가야 하는 시각
            
            const prepStartTimestamp = meetTime - totalLeadTimeMs; // 준비 시작해야 하는 시각
            totalDurationSec = (departureTimestamp - new Date().getTime()) / 1000;

            const depDate = new Date(departureTimestamp);
            departureTimeText.textContent = `${depDate.getHours().toString().padStart(2, '0')}:${depDate.getMinutes().toString().padStart(2, '0')}`;

            dashboard.style.display = 'block';
            checklistSection.style.display = 'block';
            alarmTriggered = false;

            if (timerInterval) clearInterval(timerInterval);
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        });

        // 타이머 갱신 함수
        function updateTimer() {
            const nowTime = new Date().getTime();
            const remainingSec = Math.floor((departureTimestamp - nowTime) / 1000);

            if (remainingSec <= 0) {
                // 출발 시간이 지나버린 경우
                timerDisplay.textContent = "00:00:00";
                statusBadge.textContent = "지금 당장 출발하세요!";
                statusBadge.className = "status-badge status-danger";
                progressBar.style.width = "0%";

                if (!alarmTriggered) {
                    playAlarmSound();
                    alarmTriggered = true;
                }
                return;
            }

            // 남은 시간 계산 (시:분:초)
            const hours = Math.floor(remainingSec / 3600);
            const minutes = Math.floor((remainingSec % 3600) / 60);
            const seconds = remainingSec % 60;

            timerDisplay.textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

            // 남은 비율 프로그레스 바 갱신
            const progressPercent = Math.max(0, Math.min(100, (remainingSec / totalDurationSec) * 100));
            progressBar.style.width = progressPercent + "%";

            // 상태에 따른 배지 색상 변경
            if (remainingSec > 1800) { // 30분 이상 남음
                statusBadge.textContent = "여유 있음";
                statusBadge.className = "status-badge status-safe";
                progressBar.style.backgroundColor = "#2ecc71";
            } else if (remainingSec > 600) { // 10분~30분 남음
                statusBadge.textContent = "준비 시작하세요";
                statusBadge.className = "status-badge status-warning";
                progressBar.style.backgroundColor = "#f39c12";
            } else { // 10분 이내 남음
                statusBadge.textContent = "서두르세요! 곧 출발시간입니다";
                statusBadge.className = "status-badge status-danger";
                progressBar.style.backgroundColor = "#e74c3c";
            }
        }
    </script>
</body>
</html>
